# IMPORTANT: appId intentionally matches the Tauri shell so both builds share
# the same macOS bundle identifier, keychain entries, Launchpad slot, and TCC
# permissions. In-place migration from Tauri to Electron depends on this.
appId: com.venom.cowork
productName: VenomCowork
protocols:
  - name: VenomCowork
    schemes:
      - venomcowork
directories:
  output: dist-electron
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
asar: true
asarUnpack:
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
# Venom Cowork does NOT auto-publish to a remote feed.
# Distribution is handled by the user (manual build + bundle) or a self-hosted
# update server. To enable auto-updates in the future, point publish at a
# provider that the user controls (generic provider, local HTTP, or a private
# GitHub repo owned by the operator). Do not add `provider: github` here
# unless a release workflow is configured to push assets to it.
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: VenomCowork uses the microphone when you start Voice Mode so you can speak commands to your agent.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - venomcowork-orchestrator
        - venomcowork-orchestrator-aarch64-apple-darwin
        - venomcowork-orchestrator-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "VenomCowork Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/icon.png
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - venomcowork-orchestrator
        - venomcowork-orchestrator-aarch64-unknown-linux-gnu
        - venomcowork-orchestrator-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - venomcowork-orchestrator.exe
        - venomcowork-orchestrator-aarch64-pc-windows-msvc.exe
        - venomcowork-orchestrator-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
  target:
    - nsis
artifactName: venomcowork-${os}-${arch}-${version}.${ext}
