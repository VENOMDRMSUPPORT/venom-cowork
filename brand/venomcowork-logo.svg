<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle for app icon contexts -->
  <circle cx="256" cy="256" r="240" fill="#0D1117"/>
  
  <!-- Main V monogram with venom fang -->
  <g transform="translate(80, 80)">
    <!-- V left stroke -->
    <path d="M0 0 L40 320" stroke="#22D37A" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- V right stroke with fang -->
    <path d="M120 0 L80 280 L96 320" stroke="#22D37A" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Venom fang accent on right stroke -->
    <path d="M80 280 L96 320 L104 272" fill="#22D37A" opacity="0.9"/>
    <!-- Cursor block on left stroke (represents coding/terminal) -->
    <rect x="-8" y="140" width="56" height="40" rx="4" fill="#22D37A" opacity="0.25"/>
    <rect x="4" y="148" width="24" height="24" rx="2" fill="#22D37A"/>
  </g>
  
  <!-- "COWORK" wordmark -->
  <text x="256" y="410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="48" font-weight="600" fill="#E6EDF3" text-anchor="middle" letter-spacing="4">
    COWORK
  </text>
  
  <!-- Subtle glow effect -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>