<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Main V monogram with venom fang - large scale for transparency -->
  <g transform="translate(160, 160)">
    <!-- V left stroke -->
    <path d="M0 0 L80 640" stroke="#22D37A" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- V right stroke with fang -->
    <path d="M240 0 L160 560 L192 640" stroke="#22D37A" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Venom fang accent -->
    <path d="M160 560 L192 640 L208 544" fill="#22D37A" opacity="0.9"/>
    <!-- Cursor block -->
    <rect x="-16" y="280" width="112" height="80" rx="8" fill="#22D37A" opacity="0.25"/>
    <rect x="8" y="296" width="48" height="48" rx="4" fill="#22D37A"/>
  </g>
  
  <!-- "COWORK" wordmark -->
  <text x="512" y="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="96" font-weight="600" fill="#E6EDF3" text-anchor="middle" letter-spacing="8">
    COWORK
  </text>
</svg>