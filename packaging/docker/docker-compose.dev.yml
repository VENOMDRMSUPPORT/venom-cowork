# docker-compose.dev.yml â€” Dev testability stack (no custom Dockerfile)
#
# Usage (from repo root):
#   docker compose -f packaging/docker/docker-compose.dev.yml up
#
# Then open the printed Web UI URL â€” already wired to headless, no config needed.
#
# Env overrides (optional, via .env or export):
#   VENOMCOWORK_TOKEN        â€” shared client token (auto-generated if unset)
#   VENOMCOWORK_HOST_TOKEN   â€” host/admin token (auto-generated if unset)
#   VENOMCOWORK_WORKSPACE    â€” host path to mount as workspace (default: ./workspace)
#   VENOMCOWORK_PORT         â€” host port to map to container :8787 (default: 8787)
#   WEB_PORT              â€” host port to map to container :5173 (default: 5173)
#   VENOMCOWORK_DEV_ID       â€” unique ID for this stack (default: default)
#   VENOMCOWORK_DEV_MODE     â€” enables isolated OpenCode dev state
#   VENOMCOWORK_PUBLIC_HOST  â€” browser-facing host/IP for LAN-accessible URLs
#   VENOMCOWORK_DOCKER_DEV_MOUNT_HOST_OPENCODE=1 â€” import host OpenCode config/auth into the isolated dev state
#   VENOMCOWORK_OPENCODE_CONFIG_DIR      â€” host OpenCode config dir detection override
#   VENOMCOWORK_OPENCODE_DATA_DIR        â€” host OpenCode data dir detection override
#   VENOMCOWORK_HOST_OPENCODE_CONFIG_DIR â€” import source for OpenCode config
#   VENOMCOWORK_HOST_OPENCODE_DATA_DIR   â€” import source for OpenCode auth/data

x-shared: &shared
  image: node:22-bookworm-slim
  working_dir: /app
  volumes:
    # Mount the entire repo so both services share node_modules + source
    - ../../:/app
    - pnpm-store:/root/.local/share/pnpm/store
    - bun-install:/root/.bun
    - ${VENOMCOWORK_WORKSPACE:-./workspace}:/workspace
    - ${VENOMCOWORK_HOST_OPENCODE_CONFIG_DIR:-./workspace/.venomcowork-host-opencode-config}:/persist/.config/opencode:ro
    - ${VENOMCOWORK_HOST_OPENCODE_DATA_DIR:-./workspace/.venomcowork-host-opencode-data}:/persist/.venomcowork-host-opencode-data:ro

services:
  orchestrator:
    <<: *shared
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        # --- Ensure workspace dir is writable ---
        mkdir -p /workspace && touch /workspace/.keep 2>/dev/null || true

        # --- Install system deps ---
        apt-get update -qq && apt-get install -y -qq --no-install-recommends \
          curl ca-certificates unzip git >/dev/null 2>&1

        # --- Install bun (cached in named volume) ---
        export BUN_INSTALL="/root/.bun"
        export PATH="$$BUN_INSTALL/bin:$$PATH"
        if ! command -v bun >/dev/null 2>&1; then
          echo "[orchestrator] Installing bun..."
          curl -fsSL https://bun.sh/install | bash
        fi

        # --- Enable pnpm via corepack ---
        corepack enable && corepack prepare pnpm@10.27.0 --activate

        # --- Install deps ---
        echo "[orchestrator] Installing dependencies..."
        pnpm install --no-frozen-lockfile --network-concurrency 1 --child-concurrency 1

        # --- Use source entrypoints for the dev stack ---
        # The orchestrator can spawn .ts files via Bun directly, which avoids bind-mount
        # issues from bun --compile inside Docker on macOS.
        export VENOMCOWORK_SERVER_BIN="/app/apps/server/src/cli.ts"
        export OPENCODE_ROUTER_BIN="/app/apps/opencode-router/src/cli.ts"

        # --- Resolve tokens ---
        if [ -z "$$VENOMCOWORK_TOKEN" ]; then
          VENOMCOWORK_TOKEN=$$(cat /proc/sys/kernel/random/uuid)
          export VENOMCOWORK_TOKEN
        fi
        if [ -z "$$VENOMCOWORK_HOST_TOKEN" ]; then
          VENOMCOWORK_HOST_TOKEN=$$(cat /proc/sys/kernel/random/uuid)
          export VENOMCOWORK_HOST_TOKEN
        fi

        # Write tokens so the web service can source them
        mkdir -p /app/tmp
        printf 'VENOMCOWORK_TOKEN=%s\nVENOMCOWORK_HOST_TOKEN=%s\n' \
          "$$VENOMCOWORK_TOKEN" "$$VENOMCOWORK_HOST_TOKEN" > "/app/tmp/.dev-env-${VENOMCOWORK_DEV_ID:-default}"

        echo ""
        echo "============================================"
        echo "  VenomCowork orchestrator"
        echo "  Server:     http://localhost:${VENOMCOWORK_PORT:-8787}"
        echo "  Health:     http://localhost:${VENOMCOWORK_PORT:-8787}/health"
        echo "  Token:      $$VENOMCOWORK_TOKEN"
        echo "  Host token: $$VENOMCOWORK_HOST_TOKEN"
        echo "============================================"
        echo ""

        exec pnpm --filter venomcowork-orchestrator dev -- start \
          --workspace /workspace \
          --remote-access \
          --venomcowork-port 8787 \
          --venomcowork-token "$$VENOMCOWORK_TOKEN" \
          --venomcowork-host-token "$$VENOMCOWORK_HOST_TOKEN" \
          --venomcowork-server-bin "$$VENOMCOWORK_SERVER_BIN" \
          --opencode-router-bin "$$OPENCODE_ROUTER_BIN" \
          --approval auto \
          --allow-external \
          --cors "*"
    ports:
      - "${VENOMCOWORK_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    environment:
      CI: "true"
      VENOMCOWORK_TOKEN: ${VENOMCOWORK_TOKEN:-}
      VENOMCOWORK_HOST_TOKEN: ${VENOMCOWORK_HOST_TOKEN:-}
      VENOMCOWORK_DEV_ID: ${VENOMCOWORK_DEV_ID:-default}
      VENOMCOWORK_DEV_MODE: ${VENOMCOWORK_DEV_MODE:-1}
      VENOMCOWORK_DEV_OPENCODE_IMPORT_CONFIG_DIR: /persist/.config/opencode
      VENOMCOWORK_DEV_OPENCODE_IMPORT_DATA_DIR: /persist/.venomcowork-host-opencode-data
      VENOMCOWORK_SIDECAR_SOURCE: external
 
  web:
    <<: *shared
    depends_on:
      orchestrator:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        # --- Install system deps ---
        apt-get update -qq && apt-get install -y -qq --no-install-recommends \
          curl ca-certificates >/dev/null 2>&1

        # --- Bun + pnpm ---
        export BUN_INSTALL="/root/.bun"
        export PATH="$$BUN_INSTALL/bin:$$PATH"
        if ! command -v bun >/dev/null 2>&1; then
          curl -fsSL https://bun.sh/install | bash
        fi
        corepack enable && corepack prepare pnpm@10.27.0 --activate

        # --- Read token written by orchestrator ---
        if [ -f "/app/tmp/.dev-env-${VENOMCOWORK_DEV_ID:-default}" ]; then
          . "/app/tmp/.dev-env-${VENOMCOWORK_DEV_ID:-default}"
          export VITE_VENOMCOWORK_TOKEN="$$VENOMCOWORK_TOKEN"
        fi

        echo ""
        echo "============================================"
        echo "  VenomCowork web UI"
        echo "  URL:   http://localhost:${WEB_PORT:-5173}"
        echo "  Token: $${VITE_VENOMCOWORK_TOKEN:-<see orchestrator logs>}"
        echo "============================================"
        echo ""

        export VITE_VENOMCOWORK_URL="http://${VENOMCOWORK_PUBLIC_HOST:-localhost}:${VENOMCOWORK_PORT:-8787}"
        export VITE_VENOMCOWORK_PORT="${VENOMCOWORK_PORT:-8787}"
        export VITE_ALLOWED_HOSTS="all"
        export HOST="0.0.0.0"
        export PORT="5173"

        exec pnpm --filter @venom-cowork/app exec vite \
          --host 0.0.0.0 \
          --port 5173 \
          --strictPort
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VENOMCOWORK_DEV_ID: ${VENOMCOWORK_DEV_ID:-default}

volumes:
  pnpm-store:
    name: venomcowork-dev-pnpm-store
  bun-install:
    name: venomcowork-dev-bun-install
