services:
  venomcowork-host:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep this in sync with apps/orchestrator/package.json if you want a pinned release.
        VENOMCOWORK_ORCHESTRATOR_VERSION: 0.11.22
    ports:
      - "8787:8787"
    environment:
      # Set these explicitly for stable sharing.
      # VENOMCOWORK_TOKEN: "..."
      # VENOMCOWORK_HOST_TOKEN: "..."
      # Optional: VENOMCOWORK_APPROVAL_MODE: "auto"
      # Optional: VENOMCOWORK_APPROVAL_TIMEOUT_MS: "30000"
      VENOMCOWORK_DATA_DIR: /data/venomcowork-orchestrator
      VENOMCOWORK_SIDECAR_DIR: /data/sidecars
    volumes:
      # Mount an existing project/workspace here.
      - ./workspace:/workspace
      # Persistent host data (OpenCode caches, server config, tokens).
      - ./data:/data
